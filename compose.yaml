services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: abonelik
      POSTGRES_USER: abonelik
      POSTGRES_PASSWORD: abonelik_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abonelik -d abonelik"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ghcr.io/rojhatince47/devops-dersi-proje-2:latest
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgres://abonelik:abonelik_dev@db:5432/abonelik
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
