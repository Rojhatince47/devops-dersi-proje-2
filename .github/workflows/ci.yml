name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: abonelik_test
          POSTGRES_USER: abonelik
          POSTGRES_PASSWORD: abonelik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abonelik -d abonelik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://abonelik:abonelik_dev@localhost:5432/abonelik_test

      - run: npm run lint

      - run: npm run build

      - name: Depoda gereksiz dosya kontrolü
        run: |
          if git ls-files | grep -E '^(node_modules|dist|coverage)/|(^|/)\.env$|\.superpowers/'; then
            echo "Depoda izlenmemesi gereken dosyalar var." >&2
            exit 1
          fi

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/rojhatince47/devops-dersi-proje-2
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
